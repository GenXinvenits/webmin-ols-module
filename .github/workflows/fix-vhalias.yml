name: Fix escaped VH_NAME alias

on:
  push:
    branches: [testing]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Apply VH_NAME alias fix [final]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unwanted backslash from VH_NAME alias
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('domains.cgi')
          s = p.read_text()
          old = "push @aliases,'www.\\\\$VH_NAME'; $seen{'www'}=1;"
          new = "push @aliases,'www.$VH_NAME'; $seen{'www'}=1;"
          if old not in s:
              raise SystemExit('escaped www VH_NAME alias pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm -f .github/workflows/fix-vhalias.yml
          git config user.name 'GenXinvenits'
          git config user.email 'genxinvenits@outlook.com'
          git add domains.cgi .github/workflows/fix-vhalias.yml
          git commit -m 'Apply VH_NAME alias fix [final]'
          git push

# Triggered from testing to apply the alias escaping fix.
