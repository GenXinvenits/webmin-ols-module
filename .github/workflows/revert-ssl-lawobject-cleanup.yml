name: Fix SSL uninstall cross-device removal

on:
  push:
    branches: [alpha]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix SSL uninstall cross-device removal applied'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix SSL uninstall backup location
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ssl.cgi')
          s = p.read_text()
          old = '''    my $stamp = time();
    my $backup_root = "/tmp/webmin-ols-remove-$vh-$stamp-$$";
    mkdir($backup_root) or return (0,"Unable to create temporary SSL removal backup: $!");'''
          new = '''    # Keep the backup on the same filesystem as /etc/letsencrypt.
    # /tmp may be a different filesystem, causing rename() to fail with
    # "Invalid cross-device link".
    my $backup_root = "$base_dir/.webmin-ols-remove-$vh-" . time() . "-$$";
    mkdir($backup_root) or return (0,"Unable to create temporary SSL removal backup: $!");'''
          if old not in s:
              raise SystemExit('Expected SSL uninstall backup block was not found.')
          p.write_text(s.replace(old, new, 1))
          PY
          rm -f .github/workflows/revert-ssl-lawobject-cleanup.yml
          git config user.name 'GenXinvenits'
          git config user.email 'genxinvenits@outlook.com'
          git add ssl.cgi .github/workflows/revert-ssl-lawobject-cleanup.yml
          git commit -m 'Fix SSL uninstall cross-device removal applied'
          git push origin HEAD:alpha
