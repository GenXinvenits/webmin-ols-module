name: Temporary SSL cleanup

on:
  push:
    branches: [alpha]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix cross-device SSL removal and clean up
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ssl.cgi')
          s = p.read_text()
          old = 'my $backup_root = "/tmp/webmin-ols-remove-$vh-$stamp-$$";'
          new = 'my $backup_root = "$base_dir/.webmin-ols-remove-$vh-$stamp-$$";'
          if old not in s:
              raise SystemExit('Expected SSL removal backup path was not found; refusing to modify ssl.cgi.')
          p.write_text(s.replace(old, new, 1))
          PY
          rm -f .github/workflows/temporary-ssl-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ssl.cgi .github/workflows/temporary-ssl-cleanup.yml
          git commit -m 'Fix SSL uninstall cross-device rename' || exit 0
          git push origin HEAD:alpha