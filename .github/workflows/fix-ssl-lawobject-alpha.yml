name: Fix SSL unwanted Webmin lawobject

on:
  push:
    branches: [alpha]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Remove unwanted SSL Webmin lawobject'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unwanted lawobject elements from SSL page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('ssl.cgi')
          s = p.read_text()

          # Remove any previously-added lawobject CSS rules.
          s = re.sub(r'\.lawobject\{[^}]*\}', '', s)

          # Webmin may inject empty .lawobject labels around form controls.
          # Remove those generated elements client-side without changing the SSL UI.
          marker = "<script>\n(function(){\n  var form=document.getElementById('ssl-cert-form');"
          cleanup = "<script>\n(function(){\n  function removeLawObjects(){\n    document.querySelectorAll('label.lawobject').forEach(function(el){el.remove();});\n  }\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',removeLawObjects); else removeLawObjects();\n  new MutationObserver(removeLawObjects).observe(document.documentElement,{childList:true,subtree:true});\n})();\n</script>\n<script>\n(function(){\n  var form=document.getElementById('ssl-cert-form');"

          if 'label.lawobject' not in s:
              if marker not in s:
                  raise SystemExit('SSL form script marker not found')
              s = s.replace(marker, cleanup, 1)

          p.write_text(s)
          PY
          rm -f .github/workflows/fix-ssl-lawobject-alpha.yml
          git config user.name 'GenXinvenits'
          git config user.email 'genxinvenits@outlook.com'
          git add ssl.cgi .github/workflows/fix-ssl-lawobject-alpha.yml
          git commit -m 'Remove unwanted SSL Webmin lawobject'
          git push origin HEAD:alpha
