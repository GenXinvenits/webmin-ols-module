name: Fix SSL provider radio spacing

on:
  push:
    branches: [alpha]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix SSL provider radio spacing [final]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add spacing between provider radio and heading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ssl.cgi')
          s = p.read_text()
          old = '.ols-radio-option input[type="radio"]{display:inline-block !important;margin:0 8px 0 0 !important;vertical-align:middle !important}'
          new = '.ols-radio-option .awradio{display:inline-flex !important;align-items:center !important;margin:0 8px 0 0 !important;vertical-align:middle !important}.ols-radio-option input[type="radio"]{display:inline-block !important;margin:0 !important;vertical-align:middle !important}'
          if old not in s:
              raise SystemExit('SSL radio spacing CSS not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm -f .github/workflows/fix-ssl-radio-spacing.yml
          git config user.name 'GenXinvenits'
          git config user.email 'genxinvenits@outlook.com'
          git add ssl.cgi .github/workflows/fix-ssl-radio-spacing.yml
          git commit -m 'Fix SSL provider radio spacing [final]'
          git push