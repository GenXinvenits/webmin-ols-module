name: Remove SSL duplicate lawobject labels

on:
  push:
    branches: [alpha]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Remove duplicate SSL lawobject labels [final]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove empty Webmin lawobject labels from SSL page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ssl.cgi')
          s = p.read_text()
          marker = '.ols-radio-option input[type="radio"]:disabled{opacity:.4 !important}'
          addition = '.lawobject{display:none !important}'
          if addition not in s:
              if marker not in s:
                  raise SystemExit('SSL radio CSS marker not found')
              s = s.replace(marker, marker + addition, 1)
              p.write_text(s)
          PY
          rm -f .github/workflows/fix-ssl-lawobject.yml
          git config user.name 'GenXinvenits'
          git config user.email 'genxinvenits@outlook.com'
          git add ssl.cgi .github/workflows/fix-ssl-lawobject.yml
          git commit -m 'Remove duplicate SSL lawobject labels [final]'
          git push